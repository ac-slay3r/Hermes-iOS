# Production-safe defaults. Create an owner-only .env; never load .env.example directly.
# Use a URL-safe random POSTGRES_PASSWORD (for example, a generated hex secret).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hermes_mobile
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong URL-safe POSTGRES_PASSWORD in .env}
    # No host port: the database is reachable only on the Compose network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d hermes_mobile"]
      interval: 10s
      timeout: 5s
      retries: 5

  relay:
    build: .
    env_file:
      - .env
    environment:
      RELAY_ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/hermes_mobile
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the HTTPS relay API URL ending in /v1}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set a strong INTERNAL_API_KEY}
      CONNECTOR_SETUP_SECRET: ${CONNECTOR_SETUP_SECRET:?Set a strong CONNECTOR_SETUP_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
