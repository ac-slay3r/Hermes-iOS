# Private-only Fly template; NOT the active local/systemd deployment.
# No [http_service] / [[services]]: this file does not create public ingress.
# Use your own private network and trusted TLS ingress; do not allocate public IPs.
# Fly .internal connectivity is separate from Headscale/Tailscale.
app = "hermes-mobile-relay"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "30s"

[env]
RELAY_ENVIRONMENT = "production"
PUBLIC_BASE_URL = "https://your-private-relay.example.com/v1"
HERMES_ADAPTER = "connector"

[processes]
app = "uvicorn app.main:app --host :: --port 8000 --ws-max-size 52428800"

# Set DATABASE_URL, INTERNAL_API_KEY and CONNECTOR_SETUP_SECRET via Fly secrets.
# A running private machine and an external PostgreSQL database are required.
[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"
