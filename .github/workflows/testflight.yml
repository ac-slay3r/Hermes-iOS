name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  TEAM_ID: VYJS7JMXU5
  MAIN_BUNDLE_ID: cool.n0thing.hermes
  WIDGET_BUNDLE_ID: cool.n0thing.hermes.Widgets
  MAIN_PROFILE_NAME: cool.n0thing.hermesZ
  WIDGET_PROFILE_NAME: cool.n0thing.hermes

jobs:
  bootstrap-share-profile:
    name: Bootstrap Share signing profile
    if: github.ref_type == 'branch' && github.ref_name == 'signing/share-profile'
    runs-on: macos-26
    timeout-minutes: 15
    env:
      APPSTORE_KEY_ID: 6KJFT6L8N9
      APPSTORE_ISSUER_ID: 3166b9e4-8fd3-4e9c-b3be-036cb14a4d05
      TMPDIR: /tmp/hermes-apple-profile-private
    steps:
      - name: Check App Store Connect credential
        shell: bash
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APPSTORE_PRIVATE_KEY"
          umask 077
          mkdir -p "$TMPDIR"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"
          grep -q -- 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"
          grep -q -- 'END PRIVATE KEY' "$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"

      - name: Fetch pinned Apple provisioning helpers
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/Apple-Actions/download-provisioning-profiles/42ed97749a9f9880fc9be2c0fc094ffc066f88c4/scripts'
          mkdir -p "$RUNNER_TEMP/apple-profile-tools/lib"
          curl --fail --silent --show-error --location "$BASE/lib/asc.sh" -o "$RUNNER_TEMP/apple-profile-tools/lib/asc.sh"
          curl --fail --silent --show-error --location "$BASE/ensure-bundle-id.sh" -o "$RUNNER_TEMP/apple-profile-tools/ensure-bundle-id.sh"
          curl --fail --silent --show-error --location "$BASE/create-provisioning-profile.sh" -o "$RUNNER_TEMP/apple-profile-tools/create-provisioning-profile.sh"
          cd "$RUNNER_TEMP/apple-profile-tools"
          printf '%s  %s\n' \
            'b713452e739775500123a92765ed3ac81368e72f1bc18a913d2a75545fae151b' 'lib/asc.sh' \
            'a9d8f280c3646f796436860cda5d649f62a2bcd1e02bccf3c27b784d9fb71137' 'ensure-bundle-id.sh' \
            'a59f4493e8d75db3274bcbee1e215258e6df7cf4a95b6bf817950b27428dfa03' 'create-provisioning-profile.sh' \
            | shasum -a 256 --check
          chmod 700 ensure-bundle-id.sh create-provisioning-profile.sh

      - name: Register Share App ID and assign existing App Group
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/apple-profile-tools"
          KEY="$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"
          "$TOOLS/ensure-bundle-id.sh" \
            --bundle-id cool.n0thing.hermes.Share \
            --name 'Hermes Share Extension' \
            --issuer-id "$APPSTORE_ISSUER_ID" \
            --api-key-id "$APPSTORE_KEY_ID" \
            --api-private-key-path "$KEY"

          source "$TOOLS/lib/asc.sh"
          ASC_ISSUER_ID="$APPSTORE_ISSUER_ID"
          ASC_KEY_ID="$APPSTORE_KEY_ID"
          ASC_PRIVATE_KEY_PATH="$KEY"
          asc_load_credentials
          asc_api_get '/v1/bundleIds?filter[identifier]=cool.n0thing.hermes.Share&limit=2'
          BUNDLE_RESOURCE_ID="$(printf '%s' "$ASC_API_BODY" | jq -er '.data[] | select(.attributes.identifier == "cool.n0thing.hermes.Share") | .id')"
          asc_api_get "/v1/bundleIds/$BUNDLE_RESOURCE_ID/bundleIdCapabilities"
          CAPABILITY_ID="$(printf '%s' "$ASC_API_BODY" | jq -r '.data[] | select(.attributes.capabilityType == "APP_GROUPS") | .id' | head -n1)"
          SETTINGS='[{"key":"APP_GROUP_IDS","options":[{"key":"group.cool.n0thing.hermes","enabled":true}]}]'
          if test -z "$CAPABILITY_ID"; then
            BODY="$(jq -n --arg id "$BUNDLE_RESOURCE_ID" --argjson settings "$SETTINGS" '{data:{type:"bundleIdCapabilities",attributes:{capabilityType:"APP_GROUPS",settings:$settings},relationships:{bundleId:{data:{type:"bundleIds",id:$id}}}}}')"
            asc_api_post '/v1/bundleIdCapabilities' "$BODY"
          else
            BODY="$(jq -n --arg id "$CAPABILITY_ID" --argjson settings "$SETTINGS" '{data:{type:"bundleIdCapabilities",id:$id,attributes:{settings:$settings}}}')"
            asc_api PATCH "/v1/bundleIdCapabilities/$CAPABILITY_ID" "$BODY"
          fi

      - name: Create or reuse Share App Store profile
        shell: bash
        env:
          IOS_MAIN_PROFILE_BASE64: ${{ secrets.IOS_MAIN_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"
          MAIN_PROFILE="$RUNNER_TEMP/main.mobileprovision"
          MAIN_PLIST="$RUNNER_TEMP/main-profile.plist"
          trap 'rm -f "$MAIN_PROFILE" "$MAIN_PLIST"' EXIT
          printf '%s' "$IOS_MAIN_PROFILE_BASE64" | /usr/bin/base64 -D > "$MAIN_PROFILE"
          security cms -D -i "$MAIN_PROFILE" > "$MAIN_PLIST"
          CERT_SHA="$(python3 - "$MAIN_PLIST" <<'PY'
          import hashlib, plistlib, sys
          with open(sys.argv[1], 'rb') as handle:
              profile = plistlib.load(handle)
          certificates = profile.get('DeveloperCertificates', [])
          if len(certificates) != 1:
              raise SystemExit('Expected exactly one certificate in the main distribution profile')
          print(hashlib.sha256(certificates[0]).hexdigest())
          PY
          )"
          printf '%s\n' "$CERT_SHA" > "$RUNNER_TEMP/expected-share-cert.sha256"

          source "$RUNNER_TEMP/apple-profile-tools/lib/asc.sh"
          ASC_ISSUER_ID="$APPSTORE_ISSUER_ID"
          ASC_KEY_ID="$APPSTORE_KEY_ID"
          ASC_PRIVATE_KEY_PATH="$KEY"
          asc_load_credentials
          asc_api_get '/v1/certificates?filter[certificateType]=IOS_DISTRIBUTION,DISTRIBUTION&limit=200'
          CERTIFICATE_ID="$(ASC_CERTIFICATES="$ASC_API_BODY" python3 - "$CERT_SHA" <<'PY'
          import base64, hashlib, json, os, sys
          expected = sys.argv[1]
          matches = []
          for item in json.loads(os.environ['ASC_CERTIFICATES']).get('data', []):
              content = item.get('attributes', {}).get('certificateContent')
              if content and hashlib.sha256(base64.b64decode(content)).hexdigest() == expected:
                  matches.append(item['id'])
          if len(matches) != 1:
              raise SystemExit(f'Expected one matching active distribution certificate, found {len(matches)}')
          print(matches[0])
          PY
          )"

          "$RUNNER_TEMP/apple-profile-tools/create-provisioning-profile.sh" \
            --bundle-id cool.n0thing.hermes.Share \
            --profile-type IOS_APP_STORE \
            --name cool.n0thing.hermes.Share \
            --certificate-id "$CERTIFICATE_ID" \
            --issuer-id "$APPSTORE_ISSUER_ID" \
            --api-key-id "$APPSTORE_KEY_ID" \
            --api-private-key-path "$KEY"

      - name: Download Share profile
        uses: Apple-Actions/download-provisioning-profiles@42ed97749a9f9880fc9be2c0fc094ffc066f88c4 # v6.0.0
        with:
          bundle-id: cool.n0thing.hermes.Share
          profile-type: IOS_APP_STORE
          issuer-id: ${{ env.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ env.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Verify and stage exact Share profile
        shell: bash
        run: |
          set -euo pipefail
          FOUND=0
          while IFS= read -r profile; do
            plist="$RUNNER_TEMP/candidate-profile.plist"
            security cms -D -i "$profile" > "$plist"
            app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist")"
            name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")"
            if test "$app_id" = "$TEAM_ID.cool.n0thing.hermes.Share" && test "$name" = 'cool.n0thing.hermes.Share'; then
              python3 - "$plist" "$RUNNER_TEMP/expected-share-cert.sha256" <<'PY'
          import hashlib, plistlib, pathlib, sys
          with open(sys.argv[1], 'rb') as handle:
              profile = plistlib.load(handle)
          groups = profile.get('Entitlements', {}).get('com.apple.security.application-groups')
          if groups != ['group.cool.n0thing.hermes']:
              raise SystemExit(f'Unexpected App Groups in Share profile: {groups!r}')
          certificates = profile.get('DeveloperCertificates', [])
          expected = pathlib.Path(sys.argv[2]).read_text().strip()
          if len(certificates) != 1 or hashlib.sha256(certificates[0]).hexdigest() != expected:
              raise SystemExit('Share profile certificate does not match the approved main profile certificate')
          PY
              cp "$profile" "$RUNNER_TEMP/share.mobileprovision"
              FOUND=$((FOUND + 1))
            fi
          done < <(find "$HOME/Library" -path '*Provisioning Profiles/*.mobileprovision' -type f -print)
          test "$FOUND" = 1

      - name: Preserve verified Share profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-share-profile
          path: ${{ runner.temp }}/share.mobileprovision
          if-no-files-found: error
          retention-days: 1

      - name: Remove App Store Connect private key
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"
          rm -f "$RUNNER_TEMP/expected-share-cert.sha256"
          rm -rf "$TMPDIR"

  release-gate:
    name: Require successful iOS CI for release SHA
    if: github.ref_type == 'branch' && github.ref_name != 'signing/share-profile'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify latest exact-SHA and branch CI run and all required jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_gate.py

  archive-and-upload:
    needs: release-gate
    name: Archive and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      # API-key identifiers are non-secret; the private .p8 remains in APPSTORE_PRIVATE_KEY.
      APPSTORE_KEY_ID: 6KJFT6L8N9
      APPSTORE_ISSUER_ID: 3166b9e4-8fd3-4e9c-b3be-036cb14a4d05
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Reverify latest exact-SHA and branch CI before signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_gate.py

      - name: Check required credentials
        shell: bash
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_MAIN_PROFILE_BASE64: ${{ secrets.IOS_MAIN_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_PRIVATE_KEY IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_KEYCHAIN_PASSWORD IOS_MAIN_PROFILE_BASE64 IOS_WIDGET_PROFILE_BASE64; do
            test -n "${!name:-}" || { echo "Missing required credential: $name" >&2; exit 1; }
          done

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install signing identity and profiles
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_MAIN_PROFILE_BASE64: ${{ secrets.IOS_MAIN_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/hermes-signing.keychain-db"
          P12="$RUNNER_TEMP/distribution.p12"
          PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | /usr/bin/base64 -D > "$P12"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

          install_profile() {
            local encoded="$1" source="$2" plist="$3" uuid
            printf '%s' "$encoded" | /usr/bin/base64 -D > "$source"
            security cms -D -i "$source" > "$plist"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")
            cp "$source" "$PROFILE_DIR/$uuid.mobileprovision"
            echo "$uuid" >> "$RUNNER_TEMP/installed-profile-uuids"
          }
          install_profile "$IOS_MAIN_PROFILE_BASE64" "$RUNNER_TEMP/main.mobileprovision" "$RUNNER_TEMP/main-profile.plist"
          install_profile "$IOS_WIDGET_PROFILE_BASE64" "$RUNNER_TEMP/widget.mobileprovision" "$RUNNER_TEMP/widget-profile.plist"

          test "$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/main-profile.plist")" = "$MAIN_PROFILE_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/main-profile.plist")" = "$TEAM_ID.$MAIN_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/widget-profile.plist")" = "$WIDGET_PROFILE_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/widget-profile.plist")" = "$TEAM_ID.$WIDGET_BUNDLE_ID"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install App Store Connect API key
        shell: bash
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          umask 077
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          grep -q -- 'BEGIN PRIVATE KEY' "$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          grep -q -- 'END PRIVATE KEY' "$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project HermesMobile.xcodeproj -scheme HermesMobile

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project HermesMobile.xcodeproj \
            -scheme HermesMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HermesMobile.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            clean archive

      - name: Verify archive signatures and entitlements
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/HermesMobile.xcarchive/Products/Applications/HermesMobile.app"
          WIDGET="$APP/PlugIns/HermesMobileWidgets.appex"
          test -d "$APP"
          test -d "$WIDGET"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$WIDGET"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/main-entitlements.plist"
          codesign -d --entitlements :- "$WIDGET" > "$RUNNER_TEMP/widget-entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$RUNNER_TEMP/main-entitlements.plist")" = "$TEAM_ID.$MAIN_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$RUNNER_TEMP/widget-entitlements.plist")" = "$TEAM_ID.$WIDGET_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$RUNNER_TEMP/main-entitlements.plist")" = "group.cool.n0thing.hermes"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$RUNNER_TEMP/widget-entitlements.plist")" = "group.cool.n0thing.hermes"

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>method</key><string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$MAIN_BUNDLE_ID</key><string>$MAIN_PROFILE_NAME</string>
              <key>$WIDGET_BUNDLE_ID</key><string>$WIDGET_PROFILE_NAME</string>
            </dict>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/HermesMobile.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA_COUNT=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -type f | wc -l | tr -d ' ')
          test "$IPA_COUNT" = 1

      - name: Validate and upload
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -type f -print -quit)
          xcrun altool --validate-app --type ios --file "$IPA" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Preserve export diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testflight-export-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/export/DistributionSummary.plist
            ${{ runner.temp }}/export/ExportOptions.plist
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/hermes-signing.keychain-db"
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" \
            "$RUNNER_TEMP/distribution.p12" \
            "$RUNNER_TEMP/main.mobileprovision" \
            "$RUNNER_TEMP/widget.mobileprovision" \
            "$RUNNER_TEMP/main-profile.plist" \
            "$RUNNER_TEMP/widget-profile.plist"
          if test -f "$RUNNER_TEMP/installed-profile-uuids"; then
            while IFS= read -r uuid; do
              rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
            done < "$RUNNER_TEMP/installed-profile-uuids"
          fi
