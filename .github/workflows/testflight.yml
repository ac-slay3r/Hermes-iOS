name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  TEAM_ID: VYJS7JMXU5
  MAIN_BUNDLE_ID: cool.n0thing.hermes
  WIDGET_BUNDLE_ID: cool.n0thing.hermes.Widgets
  MAIN_PROFILE_NAME: cool.n0thing.hermesZ
  WIDGET_PROFILE_NAME: cool.n0thing.hermes

jobs:
  archive-and-upload:
    name: Archive and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # API-key identifiers are non-secret; the private .p8 remains in APPSTORE_PRIVATE_KEY.
      APPSTORE_KEY_ID: 6KJFT6L8N9
      APPSTORE_ISSUER_ID: 3166b9e4-8fd3-4e9c-b3be-036cb14a4d05
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check required credentials
        shell: bash
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_MAIN_PROFILE_BASE64: ${{ secrets.IOS_MAIN_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_PRIVATE_KEY IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_KEYCHAIN_PASSWORD IOS_MAIN_PROFILE_BASE64 IOS_WIDGET_PROFILE_BASE64; do
            test -n "${!name:-}" || { echo "Missing required credential: $name" >&2; exit 1; }
          done

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install signing identity and profiles
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_MAIN_PROFILE_BASE64: ${{ secrets.IOS_MAIN_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/hermes-signing.keychain-db"
          P12="$RUNNER_TEMP/distribution.p12"
          PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | /usr/bin/base64 -D > "$P12"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

          install_profile() {
            local encoded="$1" source="$2" plist="$3" uuid
            printf '%s' "$encoded" | /usr/bin/base64 -D > "$source"
            security cms -D -i "$source" > "$plist"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")
            cp "$source" "$PROFILE_DIR/$uuid.mobileprovision"
            echo "$uuid" >> "$RUNNER_TEMP/installed-profile-uuids"
          }
          install_profile "$IOS_MAIN_PROFILE_BASE64" "$RUNNER_TEMP/main.mobileprovision" "$RUNNER_TEMP/main-profile.plist"
          install_profile "$IOS_WIDGET_PROFILE_BASE64" "$RUNNER_TEMP/widget.mobileprovision" "$RUNNER_TEMP/widget-profile.plist"

          test "$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/main-profile.plist")" = "$MAIN_PROFILE_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/main-profile.plist")" = "$TEAM_ID.$MAIN_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/widget-profile.plist")" = "$WIDGET_PROFILE_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/widget-profile.plist")" = "$TEAM_ID.$WIDGET_BUNDLE_ID"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install App Store Connect API key
        shell: bash
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          umask 077
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          grep -q -- 'BEGIN PRIVATE KEY' "$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          grep -q -- 'END PRIVATE KEY' "$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project HermesMobile.xcodeproj -scheme HermesMobile

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project HermesMobile.xcodeproj \
            -scheme HermesMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HermesMobile.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            clean archive

      - name: Verify archive signatures and entitlements
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/HermesMobile.xcarchive/Products/Applications/HermesMobile.app"
          WIDGET="$APP/PlugIns/HermesMobileWidgets.appex"
          test -d "$APP"
          test -d "$WIDGET"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$WIDGET"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/main-entitlements.plist"
          codesign -d --entitlements :- "$WIDGET" > "$RUNNER_TEMP/widget-entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$RUNNER_TEMP/main-entitlements.plist")" = "$TEAM_ID.$MAIN_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$RUNNER_TEMP/widget-entitlements.plist")" = "$TEAM_ID.$WIDGET_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$RUNNER_TEMP/main-entitlements.plist")" = "group.cool.n0thing.hermes"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$RUNNER_TEMP/widget-entitlements.plist")" = "group.cool.n0thing.hermes"

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>method</key><string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$MAIN_BUNDLE_ID</key><string>$MAIN_PROFILE_NAME</string>
              <key>$WIDGET_BUNDLE_ID</key><string>$WIDGET_PROFILE_NAME</string>
            </dict>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/HermesMobile.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA_COUNT=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -type f | wc -l | tr -d ' ')
          test "$IPA_COUNT" = 1

      - name: Validate and upload
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -type f -print -quit)
          xcrun altool --validate-app --type ios --file "$IPA" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Preserve export diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testflight-export-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/export/DistributionSummary.plist
            ${{ runner.temp }}/export/ExportOptions.plist
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/hermes-signing.keychain-db"
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" \
            "$RUNNER_TEMP/distribution.p12" \
            "$RUNNER_TEMP/main.mobileprovision" \
            "$RUNNER_TEMP/widget.mobileprovision" \
            "$RUNNER_TEMP/main-profile.plist" \
            "$RUNNER_TEMP/widget-profile.plist"
          if test -f "$RUNNER_TEMP/installed-profile-uuids"; then
            while IFS= read -r uuid; do
              rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
            done < "$RUNNER_TEMP/installed-profile-uuids"
          fi
