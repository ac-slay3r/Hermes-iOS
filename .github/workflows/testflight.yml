name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  TEAM_ID: VYJS7JMXU5
  MAIN_BUNDLE_ID: cool.n0thing.hermes
  WIDGET_BUNDLE_ID: cool.n0thing.hermes.Widgets
  SHARE_BUNDLE_ID: cool.n0thing.hermes.Share
  MAIN_PROFILE_NAME: cool.n0thing.hermesZ
  WIDGET_PROFILE_NAME: cool.n0thing.hermes
  SHARE_PROFILE_NAME: cool.n0thing.hermes.Share

jobs:
  release-gate:
    name: Require successful iOS CI for release SHA
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify latest exact-SHA and branch CI run and all required jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_gate.py

  archive-and-upload:
    needs: release-gate
    name: Archive and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      # API-key identifiers are non-secret; the private .p8 remains in APPSTORE_PRIVATE_KEY.
      APPSTORE_KEY_ID: 6KJFT6L8N9
      APPSTORE_ISSUER_ID: 3166b9e4-8fd3-4e9c-b3be-036cb14a4d05
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Reverify latest exact-SHA and branch CI before signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_gate.py

      - name: Check required credentials
        shell: bash
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_MAIN_PROFILE_BASE64: ${{ secrets.IOS_MAIN_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_PRIVATE_KEY IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_KEYCHAIN_PASSWORD IOS_MAIN_PROFILE_BASE64 IOS_WIDGET_PROFILE_BASE64 IOS_SHARE_PROFILE_BASE64; do
            test -n "${!name:-}" || { echo "Missing required credential: $name" >&2; exit 1; }
          done

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install signing identity and profiles
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_MAIN_PROFILE_BASE64: ${{ secrets.IOS_MAIN_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/hermes-signing.keychain-db"
          P12="$RUNNER_TEMP/distribution.p12"
          PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | /usr/bin/base64 -D > "$P12"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

          install_profile() {
            local encoded="$1" source="$2" plist="$3" uuid
            printf '%s' "$encoded" | /usr/bin/base64 -D > "$source"
            security cms -D -i "$source" > "$plist"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")
            cp "$source" "$PROFILE_DIR/$uuid.mobileprovision"
            echo "$uuid" >> "$RUNNER_TEMP/installed-profile-uuids"
          }
          install_profile "$IOS_MAIN_PROFILE_BASE64" "$RUNNER_TEMP/main.mobileprovision" "$RUNNER_TEMP/main-profile.plist"
          install_profile "$IOS_WIDGET_PROFILE_BASE64" "$RUNNER_TEMP/widget.mobileprovision" "$RUNNER_TEMP/widget-profile.plist"
          install_profile "$IOS_SHARE_PROFILE_BASE64" "$RUNNER_TEMP/share.mobileprovision" "$RUNNER_TEMP/share-profile.plist"

          test "$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/main-profile.plist")" = "$MAIN_PROFILE_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/main-profile.plist")" = "$TEAM_ID.$MAIN_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/main-profile.plist")" = "production"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/widget-profile.plist")" = "$WIDGET_PROFILE_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/widget-profile.plist")" = "$TEAM_ID.$WIDGET_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/share-profile.plist")" = "$SHARE_PROFILE_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/share-profile.plist")" = "$TEAM_ID.$SHARE_BUNDLE_ID"
          python3 - "$RUNNER_TEMP/share-profile.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as handle:
              groups = plistlib.load(handle)['Entitlements'].get('com.apple.security.application-groups')
          if groups != ['group.cool.n0thing.hermes']:
              raise SystemExit(f'Unexpected Share profile App Groups: {groups!r}')
          PY
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install App Store Connect API key
        shell: bash
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          umask 077
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          grep -q -- 'BEGIN PRIVATE KEY' "$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          grep -q -- 'END PRIVATE KEY' "$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project HermesMobile.xcodeproj -scheme HermesMobile

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project HermesMobile.xcodeproj \
            -scheme HermesMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HermesMobile.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            clean archive

      - name: Verify archive signatures and entitlements
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/HermesMobile.xcarchive/Products/Applications/HermesMobile.app"
          WIDGET="$APP/PlugIns/HermesMobileWidgets.appex"
          SHARE="$APP/PlugIns/HermesShareExtension.appex"
          test -d "$APP"
          test -d "$WIDGET"
          test -d "$SHARE"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$WIDGET"
          codesign --verify --strict --verbose=2 "$SHARE"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/main-entitlements.plist"
          codesign -d --entitlements :- "$WIDGET" > "$RUNNER_TEMP/widget-entitlements.plist"
          codesign -d --entitlements :- "$SHARE" > "$RUNNER_TEMP/share-entitlements.plist"
          MAIN_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          test "$MAIN_VERSION" = "$GITHUB_RUN_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$WIDGET/Info.plist")" = "$MAIN_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$SHARE/Info.plist")" = "$MAIN_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$RUNNER_TEMP/main-entitlements.plist")" = "$TEAM_ID.$MAIN_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$RUNNER_TEMP/main-entitlements.plist")" = "production"
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$RUNNER_TEMP/widget-entitlements.plist")" = "$TEAM_ID.$WIDGET_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$RUNNER_TEMP/share-entitlements.plist")" = "$TEAM_ID.$SHARE_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$RUNNER_TEMP/main-entitlements.plist")" = "group.cool.n0thing.hermes"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$RUNNER_TEMP/widget-entitlements.plist")" = "group.cool.n0thing.hermes"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$RUNNER_TEMP/share-entitlements.plist")" = "group.cool.n0thing.hermes"
          for pair in "$APP|$TEAM_ID.$MAIN_BUNDLE_ID|$MAIN_PROFILE_NAME" "$WIDGET|$TEAM_ID.$WIDGET_BUNDLE_ID|$WIDGET_PROFILE_NAME" "$SHARE|$TEAM_ID.$SHARE_BUNDLE_ID|$SHARE_PROFILE_NAME"; do
            path=${pair%%|*}; rest=${pair#*|}; expected_id=${rest%%|*}; expected_name=${rest#*|}
            security cms -D -i "$path/embedded.mobileprovision" > "$RUNNER_TEMP/archive-profile.plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/archive-profile.plist")" = "$expected_name"
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/archive-profile.plist")" = "$expected_id"
          done

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>method</key><string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$MAIN_BUNDLE_ID</key><string>$MAIN_PROFILE_NAME</string>
              <key>$WIDGET_BUNDLE_ID</key><string>$WIDGET_PROFILE_NAME</string>
              <key>$SHARE_BUNDLE_ID</key><string>$SHARE_PROFILE_NAME</string>
            </dict>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/HermesMobile.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA_COUNT=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -type f | wc -l | tr -d ' ')
          test "$IPA_COUNT" = 1

      - name: Verify exported IPA signatures, profiles, and bundle versions
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -type f -print -quit)
          OUT="$RUNNER_TEMP/exported-ipa"
          mkdir -p "$OUT"
          ditto -x -k "$IPA" "$OUT"
          APP=$(find "$OUT/Payload" -maxdepth 1 -name '*.app' -type d -print -quit)
          WIDGET="$APP/PlugIns/HermesMobileWidgets.appex"
          SHARE="$APP/PlugIns/HermesShareExtension.appex"
          test -d "$APP" && test -d "$WIDGET" && test -d "$SHARE"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$WIDGET"
          codesign --verify --strict --verbose=2 "$SHARE"
          MAIN_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          test "$MAIN_VERSION" = "$GITHUB_RUN_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$WIDGET/Info.plist")" = "$MAIN_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$SHARE/Info.plist")" = "$MAIN_VERSION"
          for pair in "$APP|$TEAM_ID.$MAIN_BUNDLE_ID|$MAIN_PROFILE_NAME" "$WIDGET|$TEAM_ID.$WIDGET_BUNDLE_ID|$WIDGET_PROFILE_NAME" "$SHARE|$TEAM_ID.$SHARE_BUNDLE_ID|$SHARE_PROFILE_NAME"; do
            path=${pair%%|*}; rest=${pair#*|}; expected_id=${rest%%|*}; expected_name=${rest#*|}
            security cms -D -i "$path/embedded.mobileprovision" > "$RUNNER_TEMP/export-profile.plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/export-profile.plist")" = "$expected_name"
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/export-profile.plist")" = "$expected_id"
            codesign -d --entitlements :- "$path" > "$RUNNER_TEMP/export-entitlements.plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$RUNNER_TEMP/export-entitlements.plist")" = "$expected_id"
            if test "$path" = "$APP"; then
              test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$RUNNER_TEMP/export-entitlements.plist")" = "production"
            fi
            test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$RUNNER_TEMP/export-entitlements.plist")" = "group.cool.n0thing.hermes"
          done

      - name: Validate and upload
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -type f -print -quit)
          xcrun altool --validate-app --type ios --file "$IPA" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Verify uploaded build appears in App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          make_token() {
            KEY_FILE="$KEY_FILE" KEY_ID="$APPSTORE_KEY_ID" ISSUER_ID="$APPSTORE_ISSUER_ID" python3 - <<'PY'
          import base64, json, os, subprocess, time
          def enc(data):
              return base64.urlsafe_b64encode(data).rstrip(b'=').decode('ascii')
          header = enc(json.dumps({'alg':'ES256','kid':os.environ['KEY_ID'],'typ':'JWT'}, separators=(',',':')).encode())
          now = int(time.time())
          payload = enc(json.dumps({'iss':os.environ['ISSUER_ID'],'iat':now,'exp':now+720,'aud':'appstoreconnect-v1'}, separators=(',',':')).encode())
          signing = f'{header}.{payload}'
          der = subprocess.check_output(['openssl','dgst','-sha256','-sign',os.environ['KEY_FILE']], input=signing.encode())
          index = 2 + (der[1] & 0x7f if der[1] & 0x80 else 0)
          rlen = der[index + 1]; r = der[index + 2:index + 2 + rlen]; index += 2 + rlen
          slen = der[index + 1]; s = der[index + 2:index + 2 + slen]
          raw = r.lstrip(b'\0').rjust(32,b'\0')[-32:] + s.lstrip(b'\0').rjust(32,b'\0')[-32:]
          print(f'{signing}.{enc(raw)}')
          PY
          }
          ASC_JWT=$(make_token)
          APP_ID=""
          for _ in $(seq 1 5); do
            ASC_JWT=$(make_token)
            if APP_ID=$(curl --fail --silent --show-error --globoff \
              -H "Authorization: Bearer $ASC_JWT" \
              'https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=cool.n0thing.hermes&limit=1' \
              | python3 -c 'import json,sys; data=json.load(sys.stdin)["data"]; assert len(data)==1; print(data[0]["id"])'); then
              break
            fi
            APP_ID=""
            sleep 10
          done
          test -n "$APP_ID"
          for _ in $(seq 1 30); do
            ASC_JWT=$(make_token)
            FOUND=$(curl --fail --silent --show-error --globoff \
              -H "Authorization: Bearer ***" \
              "https://api.appstoreconnect.apple.com/v1/builds?filter[app]=$APP_ID&filter[version]=$GITHUB_RUN_NUMBER&limit=1" \
              | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["data"]))')
            if test "$FOUND" = 1; then
              echo "Build $GITHUB_RUN_NUMBER is visible in App Store Connect."
              exit 0
            fi
            sleep 30
          done
          echo "Uploaded build $GITHUB_RUN_NUMBER did not appear within 15 minutes." >&2
          exit 1

      - name: Declare export compliance so the build reaches testers
        shell: bash
        run: |
          set -euo pipefail
          # Hermes iOS only uses standard HTTPS/TLS to talk to the paired relay;
          # it has no custom/proprietary encryption, so it qualifies for the
          # standard export exemption. Apple withholds any build from
          # TestFlight (internalBuildState/externalBuildState stay
          # MISSING_EXPORT_COMPLIANCE) until this declaration is set on the
          # build resource. Set it once, right after upload, and read back
          # buildBetaDetail to prove the block cleared.
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          make_token() {
            KEY_FILE="$KEY_FILE" KEY_ID="$APPSTORE_KEY_ID" ISSUER_ID="$APPSTORE_ISSUER_ID" python3 - <<'PY'
          import base64, json, os, subprocess, time
          def enc(data):
              return base64.urlsafe_b64encode(data).rstrip(b'=').decode('ascii')
          header = enc(json.dumps({'alg':'ES256','kid':os.environ['KEY_ID'],'typ':'JWT'}, separators=(',',':')).encode())
          now = int(time.time())
          payload = enc(json.dumps({'iss':os.environ['ISSUER_ID'],'iat':now,'exp':now+720,'aud':'appstoreconnect-v1'}, separators=(',',':')).encode())
          signing = f'{header}.{payload}'
          der = subprocess.check_output(['openssl','dgst','-sha256','-sign',os.environ['KEY_FILE']], input=signing.encode())
          index = 2 + (der[1] & 0x7f if der[1] & 0x80 else 0)
          rlen = der[index + 1]; r = der[index + 2:index + 2 + rlen]; index += 2 + rlen
          slen = der[index + 1]; s = der[index + 2:index + 2 + slen]
          raw = r.lstrip(b'\0').rjust(32,b'\0')[-32:] + s.lstrip(b'\0').rjust(32,b'\0')[-32:]
          print(f'{signing}.{enc(raw)}')
          PY
          }
          ASC_JWT=$(make_token)
          APP_ID=$(curl --fail --silent --show-error --globoff \
            -H "Authorization: Bearer ***" \
            'https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=cool.n0thing.hermes&limit=1' \
            | python3 -c 'import json,sys; data=json.load(sys.stdin)["data"]; assert len(data)==1; print(data[0]["id"])')
          ASC_JWT=$(make_token)
          BUILD_ID=$(curl --fail --silent --show-error --globoff \
            -H "Authorization: Bearer ***" \
            "https://api.appstoreconnect.apple.com/v1/builds?filter[app]=$APP_ID&filter[version]=$GITHUB_RUN_NUMBER&limit=1" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin)["data"]; assert len(data)==1; print(data[0]["id"])')
          ASC_JWT=$(make_token)
          curl --fail --silent --show-error --globoff \
            -X PATCH \
            -H "Authorization: Bearer ***" \
            -H "Content-Type: application/json" \
            -d '{"data":{"type":"builds","id":"'"$BUILD_ID"'","attributes":{"usesNonExemptEncryption":false}}}' \
            "https://api.appstoreconnect.apple.com/v1/builds/$BUILD_ID" \
            -o /dev/null
          ASC_JWT=$(make_token)
          curl --fail --silent --show-error --globoff \
            -H "Authorization: Bearer ***" \
            "https://api.appstoreconnect.apple.com/v1/builds/$BUILD_ID?include=buildBetaDetail" \
            -o /tmp/build-readback.json
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/build-readback.json"))
          encryption = d["data"]["attributes"]["usesNonExemptEncryption"]
          included = d.get("included") or []
          state = included[0]["attributes"] if included else {}
          print("usesNonExemptEncryption:", encryption)
          print("internalBuildState:", state.get("internalBuildState"))
          print("externalBuildState:", state.get("externalBuildState"))
          assert encryption is False, "export-compliance declaration did not persist"
          assert state.get("internalBuildState") != "MISSING_EXPORT_COMPLIANCE", "build is still withheld from testers"
          PY


      - name: Preserve export diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testflight-export-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/export/DistributionSummary.plist
            ${{ runner.temp }}/export/ExportOptions.plist
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/hermes-signing.keychain-db"
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" \
            "$RUNNER_TEMP/distribution.p12" \
            "$RUNNER_TEMP/main.mobileprovision" \
            "$RUNNER_TEMP/widget.mobileprovision" \
            "$RUNNER_TEMP/share.mobileprovision" \
            "$RUNNER_TEMP/main-profile.plist" \
            "$RUNNER_TEMP/widget-profile.plist" \
            "$RUNNER_TEMP/share-profile.plist" \
            "$RUNNER_TEMP/archive-profile.plist" \
            "$RUNNER_TEMP/export-profile.plist" \
            "$RUNNER_TEMP/export-entitlements.plist"
          if test -f "$RUNNER_TEMP/installed-profile-uuids"; then
            while IFS= read -r uuid; do
              rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
            done < "$RUNNER_TEMP/installed-profile-uuids"
          fi
